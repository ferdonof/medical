management:
  endpoints:
    web:
      exposure:
        include: "*"
spring:
  application:
    name: medical
  datasource:
    url: jdbc:postgresql://localhost:5433/medical
    username: postgres
    password: pgmedical
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/changelog.xml


camunda:
  bpm:
    database:
      schema-update: true
    generic-properties:
      properties:
        historyTimeToLive: 3